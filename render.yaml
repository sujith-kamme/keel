# Free-tier Blueprint. Postgres lives on Neon (its free tier doesn't expire),
# so DATABASE_URL is entered by hand. Free services sleep after 15 minutes idle.
services:
  - type: web
    name: keel-api
    runtime: node
    plan: free
    # Free plans have no pre-deploy step, so migrations run at build time.
    buildCommand: npm ci && npm run db:migrate
    startCommand: npm run start -w @keel/api
    healthCheckPath: /health
    envVars:
      # No background-worker service on the free tier: the API runs the worker.
      - key: RUN_WORKER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: keel-kv, property: connectionString }
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ZAPIER_HOOK_URL
        sync: false
      - key: KEEL_SIGNING_KEY
        sync: false
      - key: KEEL_MERCHANT_KEY
        sync: false
      - key: KEEL_OPERATOR_KEY
        sync: false
      - key: DEMO_OTP
        value: "true"
      - key: EXTRACTOR_MODEL
        value: claude-haiku-5-5
      - key: EXTRACTOR_TIMEOUT_MS
        value: "4000"
      - key: RISK_THRESHOLD
        value: "60"
      - key: RISK_HALF_LIFE_MIN
        value: "30"
      - key: CONSOLE_URL
        value: https://keel-web-fm57.onrender.com
      # The console account is created from these on first boot only; afterwards it lives in the DB.
      - key: CONSOLE_USER
        value: admin@tidewell.com
      - key: CONSOLE_PASSWORD
        sync: false
      # First-boot defaults: afterwards the values live in the settings table (console). keel-web reads them from the API.
      - key: DEMO_AGENT_MODEL
        value: claude-haiku-5-5
      - key: DEMO_AGENT_PROMPT
        value: lenient
      - key: GAUNTLET_CONCURRENCY
        value: "6"
      - key: GAUNTLET_CUSTOMER_MODEL
        value: claude-haiku-5-5
      - key: DISPUTE_AUTO_SUBMIT
        value: "true"
      - key: DISPUTE_POLL_SECONDS
        value: "120"

  - type: web
    name: keel-web
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @keel/web
    startCommand: npm run start -w @keel/web
    # The demo agent runs here as the merchant backend. It never gets PayPal credentials.
    envVars:
      - key: KEEL_API_URL
        value: https://keel-api-y0wq.onrender.com
      - key: KEEL_MERCHANT_KEY
        sync: false
      - key: KEEL_OPERATOR_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KEEL_WEB_SECRET
        sync: false
      # Inlined into the browser bundle at build time: set it before the build. Optional (trial watermark without it).
      - key: NEXT_PUBLIC_AG_GRID_LICENSE_KEY
        sync: false

  - type: keyvalue
    name: keel-kv
    plan: free
    # BullMQ requires that Redis never evicts keys.
    maxmemoryPolicy: noeviction
    ipAllowList: []
