<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="The Keel loop: 01 Certify, tested before launch. 02 Enforce, checked on every call. 03 Prove, cited in the dispute. 04 Learn, attacks become tests.">
  <title>A loop, not a filter.</title>
  <rect width="1280" height="560" rx="16" fill="#FAFAFA"/>
  <g font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <path id="track" d="M640,96 H1060 V464 H220 V96 Z" fill="none" stroke="#D4D4D8" stroke-width="3" stroke-dasharray="10 10">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <circle r="20" fill="#3B82F6" opacity="0.18"><animateMotion dur="8s" repeatCount="indefinite" path="M640,96 H1060 V464 H220 V96 Z"/></circle>
    <circle r="9" fill="#2563EB"><animateMotion dur="8s" repeatCount="indefinite" path="M640,96 H1060 V464 H220 V96 Z"/></circle>

    <!-- core -->
    <rect x="520" y="230" width="240" height="100" rx="8" fill="#18181B"/>
    <g fill="#F4F4F5" transform="translate(556 252) scale(0.33) translate(18.4 4.4)">
      <path transform="translate(0 14.0) scale(2.8) translate(-2 -18)" d="M4 20H60L52 34H12Z M29 37H41L36 56H30Z"/>
      <path transform="translate(192 0)" d="M9.8 19.6H27.72V77.98L58.38 44.24H80.5L51.24 75.32L81.48 119H61.32L39.48 85.96L27.72 98.42V119H9.8Z M87.36 81.62Q87.36 70 91.84 61.11Q96.32 52.22 104.51 47.39Q112.7 42.56 123.62 42.56Q134.26 42.56 142.31 47.32Q150.36 52.08 154.77 61.11Q159.18 70.14 159.18 82.6V86.66H105.98Q106.54 96.32 111.3 101.36Q116.06 106.4 124.18 106.4Q130.06 106.4 134.12 103.67Q138.18 100.94 139.72 96.04L158.06 97.16Q154.98 108.08 145.95 114.38Q136.92 120.68 124.04 120.68Q112.98 120.68 104.65 115.85Q96.32 111.02 91.84 102.2Q87.36 93.38 87.36 81.62ZM123.62 56.7Q116.34 56.7 111.65 61.32Q106.96 65.94 105.98 74.62H140.56Q140 65.66 135.52 61.18Q131.04 56.7 123.62 56.7Z M164.36 81.62Q164.36 70 168.84 61.11Q173.32 52.22 181.51 47.39Q189.7 42.56 200.62 42.56Q211.26 42.56 219.31 47.32Q227.36 52.08 231.77 61.11Q236.18 70.14 236.18 82.6V86.66H182.98Q183.54 96.32 188.3 101.36Q193.06 106.4 201.18 106.4Q207.06 106.4 211.12 103.67Q215.18 100.94 216.72 96.04L235.06 97.16Q231.98 108.08 222.95 114.38Q213.92 120.68 201.04 120.68Q189.98 120.68 181.65 115.85Q173.32 111.02 168.84 102.2Q164.36 93.38 164.36 81.62ZM200.62 56.7Q193.34 56.7 188.65 61.32Q183.96 65.94 182.98 74.62H217.56Q217 65.66 212.52 61.18Q208.04 56.7 200.62 56.7Z M245.42 101.36 245.56 19.6H263.48V99.54Q263.48 105.14 269.08 105.14H274.54V119H263.48Q254.8 119 250.11 114.73Q245.42 110.46 245.42 101.36Z"/>
    </g>
    <text x="640" y="316" text-anchor="middle" fill="#A1A1AA" font-size="14">one approved policy, used four ways</text>

    <!-- steps -->
    <g font-size="20" font-weight="500">
      <g transform="translate(500 46)">
        <rect width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
        <text x="24" y="40" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2">01 CERTIFY</text>
        <text x="24" y="74" fill="#18181B">Tested before launch</text>
      </g>
      <g transform="translate(920 230)">
        <rect width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
        <text x="24" y="40" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2">02 ENFORCE</text>
        <text x="24" y="74" fill="#18181B">Checked on every call</text>
      </g>
      <g transform="translate(500 414)">
        <rect width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
        <text x="24" y="40" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2">03 PROVE</text>
        <text x="24" y="74" fill="#18181B">Cited in the dispute</text>
      </g>
      <g transform="translate(80 230)">
        <rect width="280" height="100" rx="8" fill="#FFFFFF" stroke="#E4E4E7"/>
        <text x="24" y="40" fill="#71717A" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" letter-spacing="2">04 LEARN</text>
        <text x="24" y="74" fill="#18181B">Attacks become tests</text>
      </g>
    </g>
  </g>
</svg>
